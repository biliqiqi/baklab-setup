listen_addresses = '*'

# Log only DDL statements (CREATE, ALTER, DROP) by default
# Use 'none' for production, 'ddl' for normal operation, 'mod' for writes, 'all' for debugging
log_statement = 'ddl'
log_destination = 'stderr'

# Log slow queries (queries taking longer than 1 second)
log_min_duration_statement = 1000

# Reduce log verbosity
log_error_verbosity = default

shared_preload_libraries = 'pg_cron'
cron.database_name = 'postgres'

# Prevent connections from hanging idle in transaction indefinitely
idle_in_transaction_session_timeout = 30s

# Statement execution timeout to prevent runaway queries
statement_timeout = 60s

# TCP keepalives to detect dropped client connections
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 3
